name: CI

# 触发：master 推送与所有 PR
on:
  push:
    branches: [master]
  pull_request:

# 依赖全部来自仓颉中心仓（cjpm.toml 里写版本号），所以这里**不需要 checkout 兄弟仓库**，
# 只装工具链 + liburing 即可。这也是把 path 依赖换成 registry 版本换来的好处：
# 公开仓 clone 下来就能构建。
jobs:
  build-test:
    name: 构建 · 单测
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装构建依赖（liburing：badger-cj 的 io_uring 链接）
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          # auto：从 cjpm.toml 的 cjc-version 读版本（当前 1.2.0，属 STS 渠道）。
          # 免得两处各写一份，升级编译器时漏改一边。
          version: auto
          components: stdx

      - name: Build
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: cjpm build -j 16

      - name: Unit tests
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: cjpm test -j 16 --no-progress

  dsh-mem-bridge:
    name: dsh-mem-bridge（Node 插件）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dsh-mem-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 集成用例在塔不可达时自行 skip，因此 CI 里只跑纯逻辑与接线用例
      - run: npm test

  bench-harness:
    name: 评测工具（离线用例 + 变异检查）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 纯 stdlib，不连塔不联网：只验证「读取器与时间对齐」这类使结果可信的
      # 逻辑。真正的对照实验需要有实例与 LLM，不在 CI 里跑。
      - name: 回归用例
        run: python3 -m unittest test_harness -v
      # 故意破坏实现，断言用例会报警。测试通过本身说明不了什么——用例可能
      # 根本没碰到它声称覆盖的东西；这一步就是为了让那种情况失败。
      - name: 变异检查
        run: python3 check_mutations.py
