name: Release

# 触发：推送版本 tag（v*）时构建二进制 + 推送容器镜像到 ghcr.io
#
# 为什么用 tag 而不是「在 GitHub 上手动发 Release」：
#   主仓库在 AtomGit，tag 是各平台唯一的事实来源。`git tag vX.Y.Z && git push origin vX.Y.Z`
#   会把同一个 tag 同步到 GitHub，工作流据此构建产物、生成 Release 并推镜像，
#   不会出现「只在 GitHub 发版、AtomGit 侧没有对应 tag」的两边不一致。
#
# 发版步骤：本地打 tag → 推三个远端（origin / atomgit / github）→ 本工作流自动跑。
on:
  push:
    tags: ['v*']

jobs:
  binary:
    name: Linux amd64 二进制
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖（liburing：badger-cj 的 io_uring 链接）
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          # auto：跟随 cjpm.toml 的 cjc-version
          version: auto
          components: stdx

      - name: Build
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cjpm build -j 16
          # 二进制先放进 staging 再打包：dist/ 是**上传目录**，
          # 若把裸二进制也放进去，`files: dist/*` 会连它一起上传，
          # Release 里就会多出一个 35MB 的裸文件（v0.1.0/v0.1.1 都出现过），
          # 使用者不知道该下哪个。
          mkdir -p dist staging
          cp target/release/bin/chronomem.cli staging/chronomem
          # 只发一个 tar：Web 控制台的样式在编译期由 @EmbedString 嵌入二进制，
          # 运行时不读磁盘上的 public/，所以不需要单独的 public.tar.gz
          # （曾经需要它，且"解错位置就白屏"是实际踩过的坑）。
          tar -czf "dist/chronomem_${VERSION}_linux_amd64.tar.gz" -C staging chronomem
          ls -lh dist

      - name: 创建/更新 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  binary-windows:
    name: Windows amd64 二进制
    # 在 Windows runner 上**原生**编译，而不是交叉编译。
    #
    # 为什么不用 mingw 交叉编译（cjvs 那种做法）：本项目依赖里的宏包（cjxt / embed）
    # 永远用宿主工具链编译，而它们的链接行带着 ${CANGJIE_STDX_PATH}。交叉编译时这个
    # 变量只有「Linux 或 Windows」一个取值：指 Windows 则宏包用 ELF 链接器去链
    # Windows 的 libboundscheck.a（undefined reference）；指 Linux 则最终目标链接
    # 阶段报 `unknown file type: xxx.o`（拿到的是 ELF 目标文件）。两头都不通。
    # 在 Windows 上宿主即目标，这个矛盾根本不存在。
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: auto          # 跟随 cjpm.toml 的 cjc-version
          components: stdx

      # 不需要 liburing：badger-cj 的 io_uring FFI 用 @When[os == "Linux"] 守卫，
      # Windows 上自动走同步写路径；cjpm.toml 的 -luring 也只声明在 Linux target 块里。
      - name: Build
        # action 只**注入** CANGJIE_STDX_PATH_STATIC / _DYNAMIC，不直接设 CANGJIE_STDX_PATH
        # （Linux job 里也是自己显式设的）。漏了这一步，cjxt 的
        # link-option = "-L${CANGJIE_STDX_PATH} -lstdx.crypto.digest" 会展开成空串，
        # 链接阶段找不到 digest 库。
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: |
          cjpm build -j 4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          # 不写死产物名：可执行文件名由包名决定（chronomem.cli），
          # 但 CJPM 在不同版本/平台下可能带或不带 .exe 后缀——按目录里找，别猜。
          $exe = Get-ChildItem target/release/bin/ -Filter *.exe |
                   Where-Object { $_.Name -notmatch '\.(cjo|dll|pdb)$' } |
                   Select-Object -First 1
          if (-not $exe) { Write-Error "no .exe produced"; exit 1 }
          Write-Host "binary: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"
          Copy-Item $exe.FullName staging/chronomem.exe
          Compress-Archive -Path staging/chronomem.exe -DestinationPath "dist/chronomem_${env:GITHUB_REF_NAME}_windows_amd64.zip" -Force
          Get-ChildItem dist

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  container:
    name: 容器镜像（ghcr.io）
    runs-on: ubuntu-24.04
    needs: binary
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          # auto：跟随 cjpm.toml 的 cjc-version
          version: auto
          components: stdx

      # 镜像只打包宿主编译产物（Dockerfile 里 COPY target/release/bin/chronomem.cli），
      # 所以必须在 runner 上先构建。
      - name: 构建二进制（供镜像打包）
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: cjpm build -j 16

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
