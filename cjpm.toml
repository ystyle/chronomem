[package]
name = "chronomem"
version = "0.1.1"
cjc-version = "1.2.0"
output-type = "static"
compile-option = "-Woff unused"
link-option = "-lstdx.crypto.digest"
license = ["MIT"]
authors = ["ystyle"]
repository = "https://atomgit.com/ystyle/chronomem"

# 依赖一律走中心仓：公开仓 clone 下来即可构建，CI 也无需拉兄弟仓。
# 本地开发要改依赖源码时，临时换成 path（勿提交）：
#   mcp = { path = "../mcp-cj" }
[dependencies]
mcp = "2.3.18"
tsdb = "0.5.1"
llm_api = "1.4.1"
cron = "1.0.1"
cjxt = "1.2.1"
tang = "1.0.5"
cjpminfo = "1.2.0"
embed = "1.0.7"
jsonvalue = "1.1.1"
"ystyle::jsonrpc" = "0.7.9"


[package.package-configuration."chronomem.cli"]
output-type = "executable"
compile-option = "--static -Woff unused"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]

[target.x86_64-unknown-linux-gnu]
link-option = "-luring"

# Windows 目标也需要声明 stdx 的位置：源码直接 import stdx.net.http / stdx.log，
# 而 cjpm 只认**本目标块**里的 bin-dependencies。缺这块时在 Windows 上会报
# "root package 'chronomem' imports package 'stdx.*' ... but it is not added as a
# dependency in cjpm.toml"（Linux 上因为本地 cjvs stdx-env 注入过环境，看不出问题）。
#
# 不带 -luring：io_uring 是 Linux 专有，badger-cj 的 FFI 已用 @When[os == "Linux"]
# 守卫，Windows 上自动走同步写路径。
[target.x86_64-w64-mingw32.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
