[package]
name = "chronomem"
version = "0.1.0"
cjc-version = "1.1.0"
output-type = "static"
compile-option = "-Woff unused"
link-option = "-lstdx.crypto.digest"
license = ["MIT"]
authors = ["ystyle"]
repository = "https://git.mini.ystyle.top:2024/ystyle/chronomem.git"

[dependencies]
mcp = { path = "../mcp-cj" }
tsdb = { path = "../tsdb-cj" }
llm_api = { path = "../llm_api" }
cron = { path = "../cron-cj" }
cjxt = { path = "../cjxt" }
tang = "1.0.4"
jsonvalue = "1.1.0"
"ystyle::jsonrpc" = "0.7.2"

# 依赖链统一替换为本地 json-rpc 源码（receiveLoop Error 防护修复未发版，
# registry 0.7.2 无此修复；mcp-cj 传递依赖同样被替换，避免版本分裂）
[replace]
"ystyle::jsonrpc" = { path = "../json-rpc/jsonrpc" }

[package.package-configuration."chronomem.cli"]
output-type = "executable"
compile-option = "--static -Woff unused"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]

[target.x86_64-unknown-linux-gnu]
link-option = "-luring"
